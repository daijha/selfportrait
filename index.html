<!DOCTYPE html>
<html lang="en">
<link>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self Portrait</title>
<link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="onecontainer">
        <div class="picbox cloud">
            <img src="/images/cloud.png" alt="cloud doodle" />
        </div>
    </div>

    <div class="twocontainer">
        <div class="picbox music">
            <img src="/images/music note.png" alt="music note" />
        </div>
        <h1>about me</h1>
        <div class="picbox tea">
            <img src="/images/tea.png" alt="tea doodle" />

        </div>
    </div>


    <div class="mecontainer">
        <div class="mebox">
            <img src="/images/me.png" alt="self portrait doodle" />

        </div>
    </div>


    <div class="twocontainer">
        <div class="picbox book">
            <img src="/images/book.png" alt=" book doodle " />
        </div>
        <div class="picbox laptop">
            <img src="/images/laptop.png" alt="computer doodle" />
        </div>
    </div>


    <div class="onecontainer">
        <div class="picbox nature">
            <img id="naturePic" src="/images/nature.png" alt="nature doodle" />
        </div>
    </div>



</body>

</html>
